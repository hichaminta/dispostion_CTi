version: '3.8'

services:
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: cyberhud_keycloak
    command: start-dev
    ports:
      - "8080:8080"
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deployer/backend.Dockerfile
    container_name: cyberhud_backend
    working_dir: /app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    volumes:
      - app_store:/app/store
      - app_output_cve_ioc:/app/output_cve_ioc
      - app_output_enrichment:/app/output_enrichment
      - app_output_correlation:/app/output_correlation
      - app_bulletins:/app/reports/cti_bulletins
      - app_leaks:/app/leak_data_integration/results
      - app_misp_tracking:/app/misp_integration/tracking
    environment:
      - KEYCLOAK_URL=http://keycloak:8080/
    env_file:
      - ../.env
    depends_on:
      - keycloak
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
      dockerfile: ../deployer/frontend.Dockerfile
    container_name: cyberhud_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  keycloak_data:
  app_store:
  app_output_cve_ioc:
  app_output_enrichment:
  app_output_correlation:
  app_bulletins:
  app_leaks:
  app_misp_tracking:
