version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: cyberhud_mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD:-admin}
      - MYSQL_DATABASE=${MYSQL_DB:-cyberhud_db}
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-admin}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: deployer/backend.Dockerfile
    container_name: cyberhud_backend
    working_dir: /app/app/backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../app/backend:/app/app/backend
      - ../Pipeline_cti:/app/Pipeline_cti
      - ../store:/app/store
      - ../tracking:/app/tracking
      - ../leak_data_integration:/app/leak_data_integration
    environment:
      - PYTHONPATH=/app:/app/utils:/app/Pipeline_cti/scripts
      - MYSQL_USER=${MYSQL_USER:-admin}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-admin}
      - MYSQL_DB=${MYSQL_DB:-cyberhud_db}
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
    env_file:
      - ../.env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - mysql
    restart: unless-stopped

  frontend:
    build:
      context: ../app/frontend
      dockerfile: ../../deployer/frontend.Dockerfile
    container_name: cyberhud_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  adminer:
    image: adminer
    container_name: cyberhud_adminer
    restart: unless-stopped
    ports:
      - "8085:8080"
    depends_on:
      - mysql

volumes:
  mysql_data:
